name: Contract checks
'on':
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contract-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check document contracts only
        run: python tools/check_contract.py --self-test
      - run: python -m pip install -r tools/requirements-contract.txt
      - name: Validate OpenAPI and synthetic payloads
        run: python tools/validate_examples.py --self-test
      - name: Reject generated artifact drift
        run: python tools/generate_contract_artifacts.py --check
      - name: Reject Pydantic model drift
        run: python tools/gen_pydantic_models.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck generated browser bindings
        run: |
          npm install --prefix "$RUNNER_TEMP/ledger-contract-tools" --no-save --ignore-scripts typescript@5.7.3
          node "$RUNNER_TEMP/ledger-contract-tools/node_modules/typescript/bin/tsc" --strict --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM contracts/client.generated.ts contracts/typecheck_examples.ts
      - name: Test browser transport with synthetic fetch
        run: |
          node "$RUNNER_TEMP/ledger-contract-tools/node_modules/typescript/bin/tsc" --strict --target ES2022 --module commonjs --lib ES2022,DOM --outDir .contract-sdk-build contracts/client.generated.ts
          node --test tools/test_browser_client.cjs
      - name: Install CJK font for PDF export
        # ubuntu-latest 默认不带任何中日韩字体。services/exporting.py 找不到可嵌入字体时
        # 如实返回 503 EXPORT_UNAVAILABLE（这是设计，不是 bug），于是 3 个 PDF 用例在
        # CI 上必挂、在本机 Windows 上必过。这里装的字体与 backend/Dockerfile 保持一致。
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Reject contract drift in implemented endpoints
        run: python tools/check_implemented_contract.py
      - name: Run backend smoke tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
